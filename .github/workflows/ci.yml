name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  required-checks-summary:
    name: Required checks
    if: ${{ always() }}
    needs: [required-checks, cloudflare-build, fallow-audit]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Every job must succeed; only fallow-audit may also be skipped (on non-PR events).
      - name: Require successful validation
        if: ${{ needs.required-checks.result != 'success' || needs.cloudflare-build.result != 'success' || (needs.fallow-audit.result != 'success' && needs.fallow-audit.result != 'skipped') }}
        run: exit 1

  cloudflare-build:
    name: Cloudflare build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:cloudflare

  fallow-audit:
    name: Fallow audit
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Next.js types
        run: npm exec -w @tensquads/web -- next typegen

      - name: Audit changed code
        uses: fallow-rs/fallow@965f068ca91c11d6ab2a631101bcd3709569c422 # v3.46.0
        with:
          command: audit
          gate: new-only
          fail-on-issues: true
          # Re-resolve generated types instead of restoring stale missing-import results.
          no-cache: true

  required-checks:
    name: Required checks
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    # The database tests need a real Postgres with row-level security and the three roles (requirement V2).
    # The passwords are CI-only values. They are not keys of a service.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: tensquads
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tensquads"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:ci-only@127.0.0.1:5432/tensquads
      DB_USER_PASSWORD: ci-only

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The Cloudflare build job runs the full Next.js production build once; check generates route types.
      - name: Build packages
        run: npm run build -w packages --if-present

      - name: Build platform programs
        run: npm run build -w @tensquads/platform -w @tensquads/runner -w @tensquads/launcher

      - name: Check formatting, linting, and types
        run: npm run check

      - name: Apply migrations and make login users
        run: npm run db:setup

      - name: Run tests
        run: npm test

      - name: Run agent guardrails
        run: npm run agent:check

      - name: Verify vendored files against pinned upstream
        run: npm run agent:verify-upstream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # macOS runners can stay in the queue with no runner until GitHub cancels the job.
  # This job runs the same checks on macOS, and the Required checks summary does not depend on it.
  macos-checks:
    name: macOS checks
    runs-on: macos-latest
    timeout-minutes: 20
    # macOS runners cannot run service containers. This job installs Postgres 17 with Homebrew.
    env:
      DATABASE_URL: postgres://postgres:ci-only@127.0.0.1:5432/tensquads
      DB_USER_PASSWORD: ci-only

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start Postgres 17
        run: |
          brew install postgresql@17
          brew services start postgresql@17
          PG_BIN="$(brew --prefix postgresql@17)/bin"
          for _ in $(seq 1 30); do "$PG_BIN/pg_isready" -h 127.0.0.1 -p 5432 && break; sleep 1; done
          "$PG_BIN/psql" -h 127.0.0.1 -d postgres -c "CREATE ROLE postgres LOGIN SUPERUSER PASSWORD 'ci-only'"
          "$PG_BIN/createdb" -h 127.0.0.1 -U postgres tensquads

      - name: Build packages
        run: npm run build -w packages --if-present

      - name: Build platform programs
        run: npm run build -w @tensquads/platform -w @tensquads/runner -w @tensquads/launcher

      - name: Check formatting, linting, and types
        run: npm run check

      - name: Apply migrations and make login users
        run: npm run db:setup

      - name: Run tests
        run: npm test

      - name: Run agent guardrails
        run: npm run agent:check
